<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15191b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafa" media="(prefers-color-scheme: light)" />
    <title>Cascade</title>
    <script>
      // Avoid FOUC: apply persisted theme before React mounts.
      (function () {
        try {
          var t = localStorage.getItem('cascade-theme');
          if (t === 'light') document.documentElement.classList.remove('dark');
          else document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
